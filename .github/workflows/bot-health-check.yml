name: Bot Health Check

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:  # Allow manual trigger

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check bot status & alert if down
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BOT_USER_ID: ${{ secrets.BOT_USER_ID }}
        run: |
          # Get bot's status from Discord API
          RESPONSE=$(curl -s -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            "https://discord.com/api/v10/users/$BOT_USER_ID")
          
          # Check if we got valid user data
          if echo "$RESPONSE" | grep -q '"id"'; then
            echo "✅ Bot user exists in Discord API"
            # Note: Discord API /users endpoint doesn't show online status for bots
            # We need to check via gateway or just verify the token works
            # Alternative: try to fetch bot's application info
            APP_RESPONSE=$(curl -s -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
              "https://discord.com/api/v10/applications/@me")
            if echo "$APP_RESPONSE" | grep -q '"id"'; then
              echo "✅ Bot application is valid and token works"
              exit 0
            fi
          fi
          
          # If we get here, something is wrong
          echo "🔴 Bot appears down or token is invalid"
          
          # Send alert to Discord webhook
          curl -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "🔴 Bot Status Alert",
                "description": "Your bot **Rune** appears to be offline or its token is invalid!",
                "color": 15158332,
                "fields": [
                  {"name": "Time", "value": "'$(date -u +"%Y-%m-%d %H:%M:%S UTC")'", "inline": true},
                  {"name": "Check", "value": "GitHub Actions workflow `bot-health-check.yml`", "inline": true}
                ],
                "footer": {"text": "This alert fires when the bot token fails validation"}
              }]
            }' \
            "$DISCORD_WEBHOOK_URL"