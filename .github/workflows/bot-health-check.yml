name: Bot Health Check

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          HEALTH_URL: ${{ secrets.BOT_HEALTH_URL }}
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$HEALTH_URL" || echo "000")
          
          if [ "$STATUS" = "200" ]; then
            echo "✅ Bot is up"
            exit 0
          fi
          
          echo "🔴 Bot down (HTTP $STATUS)"
          
          curl -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"🔴 Rune Bot is Down!\",
                \"description\": \"Health check failed. The bot may have crashed or is unreachable.\",
                \"color\": 15158332,
                \"fields\": [
                  {\"name\": \"Status\", \"value\": \"\`${STATUS}\`\", \"inline\": true},
                  {\"name\": \"Checked\", \"value\": \"$(date -u +'%H:%M:%S UTC')\", \"inline\": true},
                  {\"name\": \"URL\", \"value\": \"${HEALTH_URL}\", \"inline\": false}
                ],
                \"footer\": {\"text\": \"GitHub Actions • 5min interval\"}
              }]
            }" \
            "$WEBHOOK_URL"